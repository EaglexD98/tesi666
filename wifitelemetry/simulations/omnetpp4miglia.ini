[General]
network = M4miglia
sim-time-limit = 3466s
debug-on-errors = true
image-path = ../../../../images
# ==============================================================
# 1) CONFIGURADOR DE LA RED FIJA + RUTA MANUAL PARA node[0]
# ==============================================================
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.optimizeRoutes = true
*.configurator.assignAddresses = true
*.configurator.assignDisjunctSubnetAddresses = true
*.configurator.displayAddresses = true
*.configurator.dumpAddresses = true
*.configurator.dumpRoutes = true
*.configurator.dumpLinks = true
*.configurator.dumpTopology = true
*.configurator.dumpConfig = "startupDump.xml"
**.routingTable.netmaskRoutes = ""
**.configurator.addSubnetRoutes = true
**.configurator.addDefaultRoutes = true
**.configurator.config = xmldoc("rutas.xml")
*.server.numWlanInterfaces = 0
# ==============================================================
# 2) FORWARDING EN NODOS INTERMEDIOS
# ==============================================================
*.router.ipv4.ip.forwarding = true
# GlobalArp ayuda a resolver MAC rápidamente en la simulación
**.ipv4.arp.typename = "GlobalArp"
**.ipv4.arp.globalArp = true
# ==============================================================
# 3) AUTOCONFIGURACIÓN DE LOS AUTOS (OBLIGATORIA EN TU ENFOQUE)
# ==============================================================
# Ojo: HostAutoConfigurator solo pone IP/máscara. No pone rutas.
# Por eso arriba le metimos la ruta default a node[0].
*.node[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.node[*].ipv4.configurator.interfaces = "wlan0 lo0"
*.node[*].ipv4.configurator.addressBase = "10.0.0.50"
*.node[*].ipv4.configurator.netmask = "255.255.0.0"
*.node[*].ipv4.routingTable.routingFile = "rutas_autos.mrt"

# ==============================================================
# 4) MODELO DE ENERGÍA Y BATERÍA (Aplica a los vehículos)
# ==============================================================
# Activamos el estado del nodo para la batería y la visualización
*.node[*].hasStatus = true
*.visualizer.energyStorageVisualizer.displayEnergyStorages = true

# power / energy storage (Modelo Li-Po 802030 de 500mAh y 3.7)
*.node[*].energyStorage.typename = "WifiBattery"
*.node[*].energyStorage.nominalVoltage = 3.7V
*.node[*].energyStorage.nominalCapacity = 500mAh
*.node[*].energyStorage.initialCapacity = 500mAh
*.node[*].energyStorage.internalResistance = 0Ohm

# energy consumer (Modelo CC con valores reales del ESP32 en mA)
*.node[*].wlan[*].radio.energyConsumer.typename = "StateBasedCcEnergyConsumer"
*.node[*].wlan[*].radio.energyConsumer.sleepCurrentConsumption = 0.17mA
*.node[*].wlan[*].radio.energyConsumer.receiverIdleCurrentConsumption = 97mA
*.node[*].wlan[*].radio.energyConsumer.receiverBusyCurrentConsumption = 97mA
*.node[*].wlan[*].radio.energyConsumer.receiverReceivingCurrentConsumption = 97mA
*.node[*].wlan[*].radio.energyConsumer.transmitterIdleCurrentConsumption = 60mA
*.node[*].wlan[*].radio.energyConsumer.transmitterTransmittingCurrentConsumption = 180mA
# recolección de estadísticas de consumo energético en los vehículos
**.node[*].energyStorage.residualCapacity.record = "vector,last"
**.node[*].wlan[*].radio.energyConsumer.currentConsumption.record = "vector,last"

# --- AÑADIR ESTO: Conecta la radio Wi-Fi a la batería del auto ---
*.node[*].wlan[*].radio.energyConsumer.energySourceModule = "^.^.^.energyStorage"

# --- AÑADIR ESTO: Recolección de métricas escalares del Wi-Fi ---
**.node[*].wlan[*].radio.energyConsumer.powerConsumption.record = "all"
**.node[*].wlan[*].radio.energyConsumer.energyConsumption.record = "all"
# (Opcional: Si tienes métricas personalizadas con esos nombres exactos)
**.node[*].wlan[*].radio.energyConsumer.Total_Energy_Joules_J.record = "last"
**.node[*].wlan[*].radio.energyConsumer.Average_Power_Watts_W.record = "last"
# ==============================================================
# 5) CONFIGURACIÓN RADIO E INFRAESTRUCTURA (AP)
# ==============================================================
*.**.wlan[*].radio.antenna.typename = "IsotropicAntenna"
*.node[*].wlan[0].radio.displayCommunicationRange = true
*.rsu*.wlan[0].radio.displayCommunicationRange = true
*.radioMedium.obstacleLoss.typename = "IdealObstacleLoss"
**.wlan[*].radio.radioMediumModule = "radioMedium"
# --- COMANDO DE POTENCIA DE TRANSMISIÓN ---
*.**.wlan[*].radio.transmitter.power = 1mW 
# --- MODO INFRAESTRUCTURA ---
*.rsu*.wlan[*].mgmt.ssid = "VANET"
*.node[*].wlan[*].mgmt.typename = "Ieee80211MgmtSta"
*.node[*].wlan[*].agent.typename = "Ieee80211AgentSta"
*.node[*].wlan[*].agent.defaultSsid = "VANET"
*.node[*].wlan[*].agent.activeScan = true
# ==============================================================
# 6) MOVILIDAD / VEINS
# ==============================================================
*.playgroundSizeX = 20000m
*.playgroundSizeY = 20000m
*.playgroundSizeZ = 50m
*.node[*].mobility.typename = "VeinsInetMobility"
*.rsu*.mobility.typename = "StationaryMobility"

# --- Posición RSU 1 (Coincide con p=2900,3010.70 del .ned) ---
*.rsu1.mobility.initialX = 2900m
*.rsu1.mobility.initialY = 3010.70m
*.rsu1.mobility.initialZ = 0m

# --- Posición RSU 2 (Coincide con p=3705.40,3283.02 del .ned) ---
*.rsu2.mobility.initialX = 3705.40m
*.rsu2.mobility.initialY = 3283.02m
*.rsu2.mobility.initialZ = 0m

# --- Posición RSU 3 (Coincide con p=3929.64,6152.16 del .ned) ---
*.rsu3.mobility.initialX = 3929.64m
*.rsu3.mobility.initialY = 6152.16m
*.rsu3.mobility.initialZ = 0m

# --- Posición RSU 4 (Coincide con p=4241.75,4763.74 del .ned) ---
*.rsu4.mobility.initialX = 4241.75m
*.rsu4.mobility.initialY = 4763.74m
*.rsu4.mobility.initialZ = 0m

# --- Posición RSU 5 (Coincide con p=4053.64,3052.80 del .ned) ---
*.rsu5.mobility.initialX = 4053.64m
*.rsu5.mobility.initialY = 3052.80m
*.rsu5.mobility.initialZ = 0m

# --- Posición RSU 6 (Coincide con p=2944.16,2544.75 del .ned) ---
*.rsu6.mobility.initialX = 2944.16m
*.rsu6.mobility.initialY = 2544.75m
*.rsu6.mobility.initialZ = 0m

# ==============================================================
# 7) MEDIO / VISUALIZACIÓN
# ==============================================================
*.visualizer.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.routingTableVisualizer.displayRoutingTables = true
*.visualizer.routingTableVisualizer.destinationFilter = "*"
*.visualizer.physicalLinkVisualizer.displayLinks = true
*.visualizer.dataLinkVisualizer.displayLinks = true
*.visualizer.networkRouteVisualizer.displayRoutes = true
**.vector-recording = true
*.node[*].wlan[*].radio.antenna.mobilityModule = "^.^.^.mobility"
*.rsu[*].wlan[*].radio.antenna.mobilityModule = "^.^.^.mobility"
*.veinsManager.host = "localhost"
*.veinsManager.port = 9999
*.veinsManager.updateInterval = 0.1s
*.veinsManager.autoShutdown = true
*.veinsManager.launchConfig = xmldoc("square.launchd.xml")
#*.veinsManager.moduleName = "node" #to work without traffic uncomment 
#*.veinsManager.moduleType = "org.car2x.veins.subprojects.veins_inet.VeinsInetCar" #to work without traffic uncomment 
*.veinsManager.moduleType = "pt_bus=org.car2x.veins.subprojects.veins_inet.VeinsInetCar BackgroundCar=0" #to work with traffic uncomment 
*.veinsManager.moduleName = "pt_bus=node BackgroundCar=0" #to work with traffic uncomment 
*.veinsManager.moduleDisplayString = "pt_bus='i=veins/node/car;is=vs' BackgroundCar='i=veins/node/car;is=vs'" #to work with traffic uncomment 
[Config TelemetryTCP]
description = "Transmisión de telemetría TCP basada en paradas de SUMO"
# ==============================================================
# 1. EL SERVIDOR (Receptor de Telemetría)
# ==============================================================
*.server.numApps = 1
*.server.app[0].typename = "wifitelemetry.TelemetryTcpFinal.TelemetryReceiverTcpFinal"
*.server.app[0].localPort = 1000
# ==============================================================
# 2. LOS AUTOS (Emisores de Telemetría)
# ==============================================================
# Aplicamos a todos los nodos (buses) usando *.node[*]
*.node[*].numApps = 1
*.node[*].app[0].typename = "wifitelemetry.TelemetryTcpFinal.TelemetrySenderTcpFinal"
# Configuración de Red
*.node[*].app[0].connectAddress = "server"
*.node[*].app[0].connectPort = 1000
# Temporizadores
*.node[*].app[0].startTime = 5s
*.node[*].app[0].sampleInterval = 1s
*.node[*].app[0].batchInterval = 5s
*.node[*].app[0].helloInterval = 0.5s
*.node[*].app[0].conditionCheckInterval = 0.1s
# --- MAPEO DE PARADAS (Lógica de transmisión reactiva) ---
# routeStops: El orden lógico de la ruta para los logs
*.node[*].app[0].routeStops = "cs_0, cs_2, cs_3, cs_4, cs_5, cs_6, cs_7, cs_8, cs_9, cs_10, cs_11, cs_12, cs_13, cs_14, cs_15, cs_16, cs_17, cs_18, cs_19, cs_20, cs_21, cs_22, cs_23, cs_24, cs_25, cs_26, cs_27, cs_28, cs_29, cs_30"
# validStops: LAS PARADAS AUTORIZADAS PARA TRANSMITIR
# Si el bus se detiene en CUALQUIERA de estas paradas y tiene WiFi, transmitirá.
*.node[*].app[0].validStops = "cs_2, cs_3, cs_5, cs_8, cs_12, cs_19, cs_26, cs_27, cs_29, cs_30"
[Config TelemetryUDP]
description = "Transmisión de telemetría UDP Burst basada en paradas de SUMO"
extends = General
# ==============================================================
# 1. EL SERVIDOR UDP
# ==============================================================
*.server.numApps = 1
*.server.app[0].typename = "wifitelemetry.TelemetryUdpFinal.TelemetryReceiverUdpFinal"
*.server.app[0].localPort = 1000
# ==============================================================
# 2. LOS AUTOS (Emisores UDP)
# ==============================================================
*.node[*].numApps = 1
*.node[*].app[0].typename = "wifitelemetry.TelemetryUdpFinal.TelemetrySenderUdpFinal"
*.node[*].app[0].connectAddress = "server"
*.node[*].app[0].connectPort = 1000
*.node[*].app[0].localPort = 2000
# Temporizadores UDP
*.node[*].app[0].startTime = 5s
*.node[*].app[0].sampleInterval = 1s
*.node[*].app[0].burstInterval = 5s
*.node[*].app[0].helloInterval = 0.5s
*.node[*].app[0].conditionCheckInterval = 0.1s
*.node[*].app[0].reconnectInterval = 1s
# MAPEO DE PARADAS 
*.node[*].app[0].routeStops = "cs_0, cs_2, cs_3, cs_4, cs_5, cs_6, cs_7, cs_8, cs_9, cs_10, cs_11, cs_12, cs_13, cs_14, cs_15, cs_16, cs_17, cs_18, cs_19, cs_20, cs_21, cs_22, cs_23, cs_24, cs_25, cs_26, cs_27, cs_28, cs_29, cs_30"
*.node[*].app[0].validStops = "cs_2, cs_3, cs_5, cs_8, cs_12, cs_19, cs_26, cs_27, cs_29, cs_30"