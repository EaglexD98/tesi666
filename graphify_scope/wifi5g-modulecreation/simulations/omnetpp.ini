[General]
network = Hybryd
sim-time-limit = 3466s
debug-on-errors = true
cmdenv-express-mode = true
cmdenv-autoflush = true
image-path = ../../../../images

##########################################################
# 1) CONFIGURADOR DE RED, IPv4 Y RUTEO HÍBRIDO           #
##########################################################
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.optimizeRoutes = true
*.configurator.assignAddresses = true
*.configurator.assignDisjunctSubnetAddresses = true
*.configurator.dumpAddresses = true
*.configurator.dumpRoutes = true
*.configurator.dumpLinks = true
*.configurator.config = xmldoc("rutas_hibridas.xml")

# Forwarding en el router central y resolución ARP global
*.router.ipv4.ip.forwarding = true
**.ipv4.arp.typename = "GlobalArp"
**.ipv4.arp.globalArp = true

# Autoconfiguración de los vehículos (NrCarCustom2)
*.car[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.car[*].ipv4.configurator.interfaces = "cellular wlan0 lo0"
*.car[*].ipv4.configurator.addressBase = "10.0.0.50"
*.car[*].ipv4.configurator.netmask = "255.255.0.0"

# Desactivamos interfaces WLAN innecesarias en el servidor
*.server.numWlanInterfaces = 0

##########################################################
# 2) VEINS, SUMO Y MOVILIDAD                             #
##########################################################
*.playgroundSizeX = 30000m
*.playgroundSizeY = 30000m
*.playgroundSizeZ = 50m

*.veinsManager.host = "localhost"
*.veinsManager.port = 9999
*.veinsManager.updateInterval = 0.1s
*.veinsManager.autoShutdown = true
*.veinsManager.launchConfig = xmldoc("square.launchd.xml")

# Integración del nuevo nodo híbrido
*.veinsManager.moduleType = "pt_bus=simu5g.nodes.NrCarCustom2 BackgroundCar=0"
*.veinsManager.moduleName = "pt_bus=car BackgroundCar=0"
*.veinsManager.moduleDisplayString = "pt_bus='i=veins/node/car;is=vs' BackgroundCar='i=veins/node/car;is=vs'"

# Movilidad
*.car[*].mobility.typename = "VeinsInetMobility"
*.gNodeB*.mobility.typename = "StationaryMobility"
*.rsu*.mobility.typename = "StationaryMobility"

# --- Coordenadas RSUs (Wi-Fi) ---
*.rsu1.mobility.initialX = 2900m
*.rsu1.mobility.initialY = 3010.70m
*.rsu1.mobility.initialZ = 0m

*.rsu2.mobility.initialX = 3705.40m
*.rsu2.mobility.initialY = 3283.02m
*.rsu2.mobility.initialZ = 0m

*.rsu3.mobility.initialX = 3929.64m
*.rsu3.mobility.initialY = 6152.16m
*.rsu3.mobility.initialZ = 0m

*.rsu4.mobility.initialX = 4241.75m
*.rsu4.mobility.initialY = 4763.74m
*.rsu4.mobility.initialZ = 0m

*.rsu5.mobility.initialX = 4053.64m
*.rsu5.mobility.initialY = 3052.80m
*.rsu5.mobility.initialZ = 0m

*.rsu6.mobility.initialX = 2944.16m
*.rsu6.mobility.initialY = 2544.75m
*.rsu6.mobility.initialZ = 0m

# --- Coordenadas gNodeBs (5G) ---
*.gNodeB1.mobility.initialX = 2900m
*.gNodeB1.mobility.initialY = 3000m
*.gNodeB1.mobility.initialZ = 15m

*.gNodeB2.mobility.initialX = 2904m
*.gNodeB2.mobility.initialY = 1747m
*.gNodeB2.mobility.initialZ = 15m

*.gNodeB3.mobility.initialX = 4062m
*.gNodeB3.mobility.initialY = 3335m
*.gNodeB3.mobility.initialZ = 15m

*.gNodeB4.mobility.initialX = 4430m
*.gNodeB4.mobility.initialY = 4580m
*.gNodeB4.mobility.initialZ = 15m

*.gNodeB5.mobility.initialX = 2580m
*.gNodeB5.mobility.initialY = 4337m
*.gNodeB5.mobility.initialZ = 15m

*.gNodeB6.mobility.initialX = 4000m
*.gNodeB6.mobility.initialY = 6050m
*.gNodeB6.mobility.initialZ = 15m

*.gNodeB7.mobility.initialX = 2400m
*.gNodeB7.mobility.initialY = 6370m
*.gNodeB7.mobility.initialZ = 15m

*.gNodeB8.mobility.initialX = 1600m
*.gNodeB8.mobility.initialY = 5230m
*.gNodeB8.mobility.initialZ = 15m

##########################################################
# 3) CONFIGURACIÓN RADIO WI-FI E INFRAESTRUCTURA L2      #
##########################################################
*.radioMedium.obstacleLoss.typename = "IdealObstacleLoss"
**.wlan[*].radio.radioMediumModule = "radioMedium"

*.**.wlan[*].radio.antenna.typename = "IsotropicAntenna"
*.car[*].wlan[*].radio.antenna.mobilityModule = "^.^.^.mobility"
*.rsu[*].wlan[*].radio.antenna.mobilityModule = "^.^.^.mobility"

*.**.wlan[*].radio.transmitter.power = 1mW 
*.car[*].wlan[0].radio.displayCommunicationRange = true
*.rsu*.wlan[0].radio.displayCommunicationRange = true

# Modo Infraestructura
*.rsu*.wlan[*].mgmt.ssid = "VANET"
*.car[*].wlan[*].mgmt.typename = "Ieee80211MgmtSta"
*.car[*].wlan[*].agent.typename = "Ieee80211AgentSta"
*.car[*].wlan[*].agent.defaultSsid = "VANET"
*.car[*].wlan[*].agent.activeScan = true

##########################################################
# 4) CONFIGURACIÓN 5G NR, HANDOVERS Y ENLACES X2         #
##########################################################
**.numBands = 50
**.ueTxPower = 23dBm
**.eNodeBTxPower = 42dBm  

# Asociación Dinámica y Handover
*.car[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.car[*].cellularNic.nrMac.dynamicCellAssociation = true
*.car[*].cellularNic.nrMac.enableHandover = true
*.car[*].cellularNic.nrPhy.enableHandover = true
*.gNodeB*.cellularNic.phy.enableHandover = true
*.gNodeB*.cellularNic.phy.handoverLatency = 50ms 
*.gNodeB*.cellInfo.broadcastMessageInterval = 1s

*.car[*].masterId = 0     
*.car[*].macCellId = 0    
*.car[*].nrMasterId = 2     
*.car[*].nrMacCellId = 2    

# Identificadores de Celda
**.gNodeB1.macCellId = 1
**.gNodeB1.macNodeId = 1
**.gNodeB2.macCellId = 2
**.gNodeB2.macNodeId = 2 
**.gNodeB3.macCellId = 3
**.gNodeB3.macNodeId = 3
**.gNodeB4.macCellId = 4
**.gNodeB4.macNodeId = 4
**.gNodeB5.macCellId = 5
**.gNodeB5.macNodeId = 5
**.gNodeB6.macCellId = 6
**.gNodeB6.macNodeId = 6
**.gNodeB7.macCellId = 7
**.gNodeB7.macNodeId = 7
**.gNodeB8.macCellId = 8
**.gNodeB8.macNodeId = 8

# --- CONFIGURACIÓN ESTRICTA X2 (TOPOLOGÍA ESCALERA) ---
*.gNodeB1.numX2Apps = 3
*.gNodeB2.numX2Apps = 2
*.gNodeB3.numX2Apps = 3
*.gNodeB4.numX2Apps = 3
*.gNodeB5.numX2Apps = 3
*.gNodeB6.numX2Apps = 2
*.gNodeB7.numX2Apps = 2
*.gNodeB8.numX2Apps = 2

*.gNodeB*.x2App[0].server.localPort = 5000
*.gNodeB*.x2App[1].server.localPort = 5001
*.gNodeB*.x2App[2].server.localPort = 5002
*.gNodeB*.x2App[*].hopCount = 1

# gNodeB1
*.gNodeB1.x2App[0].client.connectAddress = "gNodeB2%x2ppp0"
*.gNodeB1.x2App[0].client.connectPort    = 5000
*.gNodeB1.x2App[1].client.connectAddress = "gNodeB5%x2ppp0"
*.gNodeB1.x2App[1].client.connectPort    = 5000
*.gNodeB1.x2App[2].client.connectAddress = "gNodeB3%x2ppp2"
*.gNodeB1.x2App[2].client.connectPort    = 5002
# gNodeB2
*.gNodeB2.x2App[0].client.connectAddress = "gNodeB1%x2ppp0"
*.gNodeB2.x2App[0].client.connectPort    = 5000
*.gNodeB2.x2App[1].client.connectAddress = "gNodeB3%x2ppp1"
*.gNodeB2.x2App[1].client.connectPort    = 5001
# gNodeB3
*.gNodeB3.x2App[0].client.connectAddress = "gNodeB4%x2ppp0"
*.gNodeB3.x2App[0].client.connectPort    = 5000
*.gNodeB3.x2App[1].client.connectAddress = "gNodeB2%x2ppp1"
*.gNodeB3.x2App[1].client.connectPort    = 5001
*.gNodeB3.x2App[2].client.connectAddress = "gNodeB1%x2ppp2"
*.gNodeB3.x2App[2].client.connectPort    = 5002
# gNodeB4
*.gNodeB4.x2App[0].client.connectAddress = "gNodeB3%x2ppp0"
*.gNodeB4.x2App[0].client.connectPort    = 5000
*.gNodeB4.x2App[1].client.connectAddress = "gNodeB6%x2ppp0"
*.gNodeB4.x2App[1].client.connectPort    = 5000
*.gNodeB4.x2App[2].client.connectAddress = "gNodeB5%x2ppp2"
*.gNodeB4.x2App[2].client.connectPort    = 5002
# gNodeB5
*.gNodeB5.x2App[0].client.connectAddress = "gNodeB1%x2ppp1"
*.gNodeB5.x2App[0].client.connectPort    = 5001
*.gNodeB5.x2App[1].client.connectAddress = "gNodeB8%x2ppp0"
*.gNodeB5.x2App[1].client.connectPort    = 5000
*.gNodeB5.x2App[2].client.connectAddress = "gNodeB4%x2ppp2"
*.gNodeB5.x2App[2].client.connectPort    = 5002
# gNodeB6
*.gNodeB6.x2App[0].client.connectAddress = "gNodeB4%x2ppp1"
*.gNodeB6.x2App[0].client.connectPort    = 5001
*.gNodeB6.x2App[1].client.connectAddress = "gNodeB7%x2ppp0"
*.gNodeB6.x2App[1].client.connectPort    = 5000
# gNodeB7
*.gNodeB7.x2App[0].client.connectAddress = "gNodeB6%x2ppp1"
*.gNodeB7.x2App[0].client.connectPort    = 5001
*.gNodeB7.x2App[1].client.connectAddress = "gNodeB8%x2ppp1"
*.gNodeB7.x2App[1].client.connectPort    = 5001
# gNodeB8
*.gNodeB8.x2App[0].client.connectAddress = "gNodeB5%x2ppp1"
*.gNodeB8.x2App[0].client.connectPort    = 5001
*.gNodeB8.x2App[1].client.connectAddress = "gNodeB7%x2ppp1"
*.gNodeB8.x2App[1].client.connectPort    = 5001

############################################################
# 5) APLICACIONES (Test de Ruteo Híbrido Base)             #
############################################################
# --- SERVIDOR ---
*.server.numApps = 2

# App 0: Receptor UDP (Escucha en la interfaz Wi-Fi)
*.server.app[0].typename = "inet.applications.udpapp.UdpEchoApp"
*.server.app[0].localPort = 5000

# App 1: Receptor UDP/VoIP (Escucha en la interfaz 5G)
*.server.app[1].typename = "inet.applications.udpapp.UdpSink"
*.server.app[1].localPort = 3000

# --- VEHÍCULOS (car[*]) ---
*.car[*].numApps = 2

# App 0: Emisor UDP -> Dirigido a 10.1.0.2 (Ruteo fuerza salida Wi-Fi)
*.car[*].app[0].typename = "inet.applications.udpapp.UdpBasicApp"
*.car[*].app[0].destAddresses = "10.1.0.2"
*.car[*].app[0].destPort = 5000
*.car[*].app[0].messageLength = 1000B
*.car[*].app[0].sendInterval = 500ms
*.car[*].app[0].startTime = 5s


# App 1: Emisor VoIP -> Dirigido a 10.2.0.2 (Ruteo fuerza salida 5G GTP)
*.car[*].app[1].typename = "inet.applications.udpapp.UdpBasicApp"
*.car[*].app[1].destAddresses = "10.2.0.2" 
*.car[*].app[1].destPort = 3000
*.car[*].app[1].messageLength = 40B
*.car[*].app[1].sendInterval = 20ms
*.car[*].app[1].startTime = 5s

############################################################
# 6) VISUALIZACIÓN Y VECTORES DE RECOLECCIÓN               #
############################################################
**.vector-recording = true
**.scalar-recording = true

*.visualizer.osgVisualizer.typename = ""
*.visualizer.mediumVisualizer.displaySignals = true
*.visualizer.mediumVisualizer.displayTransmissions = true
*.visualizer.mediumVisualizer.displayReceptions = true
*.visualizer.mediumVisualizer.displayCommunicationRanges = true
*.visualizer.*.physicalLinkVisualizer.displayLinks = true
*.visualizer.routingTableVisualizer.displayRoutingTables = true
*.visualizer.networkRouteVisualizer.displayRoutes = true

# Registro explícito de Handovers, Jitter (ms) y Throughput 
**.car[*].cellularNic.nrPhy.servingCell.vector-recording = true 
**.car[*].cellularNic.nrMac.macDelayDL.vector-recording = true
**.car[*].cellularNic.nrMac.macDelayUL.vector-recording = true
**.car[*].cellularNic.nrMac.macThroughputDL.vector-recording = true
**.car[*].cellularNic.nrMac.macThroughputUL.vector-recording = true
**.car[*].cellularNic.nrMac.macCellPacketLossDL.vector-recording = true
**.car[*].cellularNic.nrMac.macCellPacketLossUL.vector-recording = true