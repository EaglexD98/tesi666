[General]
network = Scenariov6g
sim-time-limit = 49s

debug-on-errors = true
cmdenv-express-mode = true
cmdenv-autoflush = true
image-path = ../../../../images

##########################################################
#            SaveINFO				                     #
##########################################################

**.scalar-recording = true
**.vector-recording = true
*.car[*].app[*].**.vector-recording = true
*.server.app[*].**.vector-recording = true


##########################################################
#            Parámetros globales                         #
##########################################################

*.playgroundSizeX = 20000m
*.playgroundSizeY = 20000m
*.playgroundSizeZ = 50m

**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false
**.routingRecorder.enabled = false



##########################################################
#   Veins + SUMO (MANAGER MIXTO WiFi + 5G)
##########################################################

*.veinsManager.host = "localhost"
*.veinsManager.port = 9999
*.veinsManager.updateInterval = 0.1s
*.veinsManager.autoShutdown = true
*.veinsManager.launchConfig = xmldoc("square.launchd.xml")

# MAPEO vType SUMO → módulo OMNeT++
# wifiCar → node[]
# nrCar   → car[]
*.veinsManager.moduleType = "wifiCar=org.car2x.veins.subprojects.veins_inet.VeinsInetCar nrCar=simu5g.nodes.NrCar"
*.veinsManager.moduleName = "wifiCar=node nrCar=car"
*.veinsManager.moduleDisplayString = "wifiCar='i=veins/node/car;is=vs' nrCar='i=veins/node/car;is=vs'"

############################################################
#  MOVILIDAD
############################################################

*.node[0].mobility.typename = "VeinsInetMobility"
*.car[1].mobility.typename  = "VeinsInetMobility"



############################################################
#  RADIO / 802.11p PARA WiFi
############################################################

*.**.wlan[0].opMode = "p"
*.**.wlan[0].radio.typename = "Ieee80211DimensionalRadio"
*.**.wlan[0].radio.bandName = "5.9 GHz"
*.**.wlan[0].radio.channelNumber = 3
*.**.wlan[0].radio.transmitter.power = 20mW
*.**.wlan[0].radio.bandwidth = 10 MHz

*.**.wlan[*].radio.antenna.typename = "IsotropicAntenna"

*.node[*].wlan[0].radio.displayCommunicationRange = true
*.rsu[*].wlan[0].radio.displayCommunicationRange = true



############################################################
#  IPv4 WiFi (node[] y rsu[])
############################################################

*.node[0].ipv4.configurator.typename = "HostAutoConfigurator"
*.node[0].ipv4.configurator.interfaces = "wlan0"
*.node[0].ipv4.configurator.mcastGroups = "224.0.0.1"

*.rsu[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.rsu[*].ipv4.configurator.interfaces = "wlan0"
*.rsu[*].ipv4.configurator.mcastGroups = "224.0.0.1"

*.node[*].ipv4.arp.typename = "GlobalArp"
*.rsu[*].ipv4.arp.typename = "GlobalArp"



############################################################
#  APLICACIONES TCP WiFi (VeinsInetCar)
############################################################

*.node[0].numApps = 1
*.node[0].app[0].typename = "inet.applications.tcpapp.TcpBasicClientApp"
*.node[0].app[0].connectAddress = "rsu[0]"
*.node[0].app[0].connectPort = 5000

*.node[0].app[0].tOpen  = 10s
*.node[0].app[0].tSend  = 10.1s
*.node[0].app[0].tClose = 48s
*.node[0].app[0].startTime = 10s
*.node[0].app[0].idleInterval = 2s
*.node[0].app[0].thinkTime   = 2s

*.rsu[*].numApps = 1
*.rsu[*].app[0].typename = "inet.applications.tcpapp.TcpEchoApp"
*.rsu[*].app[0].localPort = 5000



##########################################################
#          Parámetros específicos 5G / NR                #
##########################################################

# Number of Resource Blocks
**.numBands = 25

# Transmission Power
**.ueTxPower = 26dBm
**.eNodeBTxPower = 46dBm

# Enable dynamic association
*.car[*].cellularNic.nrPhy.dynamicCellAssociation = true

*.car[*].masterId    = 0
*.car[*].macCellId   = 0
*.car[*].nrMasterId  = 1
*.car[*].nrMacCellId = 1

# eNodeB configuration
**.gNodeB1.macCellId = 1
**.gNodeB1.macNodeId = 1

# Handover options
*.car[*].cellularNic.nrPhy.enableHandover = true
*.gNodeB1.cellularNic.phy.enableHandover = true
*.gNodeB1.cellularNic.phy.handoverLatency = 50ms
*.gNodeB1.cellInfo.broadcastMessageInterval = 1s



############################################################
#  IPv4 / ARP (5G)
############################################################

**.ipv4.arp.typename = "GlobalArp"



############################################################
#  Visualización
############################################################

**.vector-recording = true

*.visualizer.osgVisualizer.typename = ""

*.visualizer.mediumVisualizer.displaySignals             = true
*.visualizer.mediumVisualizer.displayTransmissions       = true
*.visualizer.mediumVisualizer.displayReceptions          = true
*.visualizer.mediumVisualizer.displayCommunicationRanges = true
*.visualizer.mediumVisualizer.displayInterferenceRanges  = false

*.visualizer.*.physicalLinkVisualizer.displayLinks = true



############################################################
#  APLICACIONES 5G (VoIP)
############################################################


############################################################
#   CONFIG --- VoIP UPLINK (car[1] → server)
############################################################

[Config VoIP-UL]

*.server.numApps = 10
*.server.app[*].typename   = "VoipReceiver"
*.server.app[*].localPort  = 3000 + ancestorIndex(0)

# car[0] sin app
*.car[0].numApps = 0

# car[1] envía tráfico VoIP UL
*.car[1].numApps = 1
*.car[1].app[0].typename    = "VoipSender"
*.car[1].app[0].destAddress = "server"
*.car[1].app[0].destPort    = 3000 + ancestorIndex(1)



############################################################
#   CONFIG --- VoIP DOWNLINK (server → car[1])
############################################################

[Config VoIP-DL]

*.server.numApps = 10
*.server.app[*].typename    = "VoipSender"
*.server.app[*].localPort   = 3000 + ancestorIndex(0)
*.server.app[*].destAddress = "car[" + string(ancestorIndex(0)) + "]"
*.server.app[*].startTime   = 0.05s

*.car[0].numApps = 0

*.car[1].numApps = 1
*.car[1].app[0].typename    = "VoipReceiver"



############################################################
#  OSG
############################################################

[Config osg]
*.useOsg = true
*.visualizer.osgVisualizer.typename = IntegratedOsgVisualizer
